name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macOS-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macOS-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x64

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.label }})

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Hush ${{ github.ref_name }}"
          releaseBody: |
            Download Hush for your platform below.

            ### macOS Installation
            1. Download the `.dmg` for your Mac (Apple Silicon → `aarch64`, Intel → `x64`)
            2. Open the `.dmg` and drag **Hush.app** to your Applications folder
            3. Because Hush is not yet notarized with Apple, macOS may block the first launch.
               **To allow it:** open **System Settings → Privacy & Security**, scroll down, and click **"Open Anyway"** next to Hush.

            If you see a _"damaged"_ error instead, run this once in Terminal:
            ```
            sudo xattr -cr /Applications/Hush.app
            ```
            Then double-click Hush again.

            ### Windows Installation
            Run the `.exe` installer. If Windows Defender SmartScreen warns you, click **More info → Run anyway**.
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
